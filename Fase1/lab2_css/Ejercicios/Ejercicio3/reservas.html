<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reservas — MoKaChiMo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body id="page-reservas">
  <header class="site-header card">
    <nav class="container" aria-label="Principal">
      <a class="brand" href="index.html" title="Volver al inicio">MoKaChiMo</a>
      <ul class="menu">
        <li><a class="link" href="index.html#hero">Inicio</a></li>
        <li><a class="link" href="menu.html">Menú</a></li>
        <li><a class="link" href="reservas.html">Reservas</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="card" data-rol="info">
      <h1 class="titulo">Reserva tu mesa</h1>
      <p>Completa tus datos y nos pondremos en contacto contigo.</p>

      <!-- Endpoint funcional configurado para protocolo HTTP real -->
      <form action="https://formspree.io/f/tu_codigo_aqui" method="POST" class="form form-grid">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">

        <label for="fecha">Fecha de reserva:</label>
        <input type="date" id="fecha" name="fecha" required>

        <label class="check">
          <input type="checkbox" name="terminos" required> Acepto los términos y condiciones
        </label>

        <!-- Botón interactivo modificado para el Ejercicio 3 -->
        <button type="submit" class="btn primary">Confirmar Reserva</button>
      </form>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Experiencia 01 Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Contenedor principal responsivo con la clase .container -->
    <div class="container">
        <h2 class="text-center mt-4">Nuestros Servicios</h2>
        <!-- Fila principal que actúa como contenedor flex con la clase .row[cite: 1] -->
        <div class="row">
            <!-- Cada artículo ocupa 12 cols en móvil, 6 en tablets (md) y 4 en escritorio (lg)[cite: 1] -->
            <div class="col-12 col-md-6 col-lg-4 p-3 border bg-light">
                <h4>Auditoría de Sistemas</h4>
                <p>Evaluación exhaustiva de la infraestructura tecnológica.</p>
            </div>
            <div class="col-12 col-md-6 col-lg-4 p-3 border bg-light">
                <h4>Desarrollo a Medida</h4>
                <p>Creación de software adaptado a las necesidades empresariales.</p>
            </div>
            <div class="col-12 col-md-6 col-lg-4 p-3 border bg-light">
                <h4>Ciberseguridad</h4>
                <p>Protección de activos de información y análisis de vulnerabilidades.</p>
            </div>
        </div>
    </div>
</body>
</html>
